name: Auto Merge Dev to QA

on:
  push:
    branches:
      - dev  # Trigger when code is pushed to dev branch

jobs:
  merge_to_qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for merging

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Authenticate with GitHub
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/Shivesh1996/flask_deploment.git

      - name: Checkout QA branch
        run: |
          git checkout QA
          git pull origin QA  # Ensure latest changes are fetched

      - name: Remove `.env`, `upgrade.yaml`, and workflow files before merging
        run: |
          git rm --cached .env upgrade.yaml .github/workflows/dev-to-qa.yml || echo "Files not tracked, skipping..."
          git commit -m "Remove ignored files before merge" || echo "No changes to commit"
          git push origin QA

      - name: Merge Dev into QA
        run: |
          git merge origin/dev --no-edit --strategy-option=theirs || echo "Merge conflict, resolving..."
          git push origin QA
